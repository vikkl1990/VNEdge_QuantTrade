# VN Edge production stack
version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vnedge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: vnedge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnedge"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vnedge:${DB_PASSWORD}@postgres:5432/vnedge
      FERNET_KEY: ${FERNET_KEY:?required}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?required}
      DELTA_API_KEY: ${DELTA_API_KEY:?required}
      DELTA_API_SECRET: ${DELTA_API_SECRET:?required}
      ENABLE_JSON_LOGS: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8080:8080"
    volumes:
      - botstorage:/app/storage
      - botlogs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  botstorage:
  botlogs:
